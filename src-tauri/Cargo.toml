[package]
name = "noting-down"
version = "0.1.0"
description = "Handwriting notes with palm rejection"
edition = "2021"

[lib]
name = "noting_down_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
